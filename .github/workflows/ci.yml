name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Windows es la plataforma del analista: su consola cp1252 es la que
        # revienta con un caracter fuera de rango (CONTRIBUTING 4.3).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Sintaxis de los tools
        run: python -c "import ast,glob;[ast.parse(open(f,encoding='utf-8').read()) for f in glob.glob('tools/*.py')];print('[ok] sintaxis')"
      - name: Demo del builder + audit de formato
        run: |
          mkdir -p scratch
          python tools/xlsx_builder.py demo ./scratch/demo.xlsx
      - name: Pruebas unitarias (sin red)
        run: python -m unittest discover -s tests -v
