# macro-view.yaml — house view macro COMPARTIDO por toda la cobertura
# Vive en <raiz>/macro/macro-view.yaml (nombre fijo — lo consume código),
# FUERA de las carpetas por emisora. Uno solo para todas.
# Lo llena el analista. El plugin puede PROPONERLO desde macro/sources/
# (/update-macro: propuesta campo por campo con cita, gate por campo) — pero
# cada valor lo confirma el analista; el plugin jamás lo decide.
# Antes de cada actualización: snapshot a macro/history/macro-view_YYYY-MM-DD.yaml.
# Cada valor lleva fuente y fecha — si la fuente es pública oficial (Banxico,
# encuestas de expectativas, Fed SEP), etiqueta observado; si es juicio propio
# o de la casa, etiqueta supuesto; si viene de research de terceros, cita el
# documento (opinión de tercero se atribuye, no se vuelve supuesto sin gate).

#
# Forma de un DATO: todo mapa con `value` es un dato y lleva `value` numérico y
# `source` (propio o del mapa que lo contiene: la cita de un ERP cubre sus
# componentes; la de una ruta, sus puntos). `value: null` con source = pendiente
# declarado (K3 avisa). `{}` y `[]` = no capturado todavía. Lo valida K3
# (tools/contract_check.py).
#
# Los campos de primer nivel (rates, fx, inflation, gdp, equity_risk_premium)
# son el país por defecto del workspace (Estados Unidos en la cobertura SEC).
# Cada país adicional va en su bloque dentro de `countries:` (ver abajo).

updated_at: ""                # YYYY-MM-DD — preflight avisa si stale (> staleness_warn_months)
owner: ""                     # analista o casa
staleness_warn_months: 3
gate_status: ""               # opcional: estado del gate del analista sobre el archivo
                              # (p. ej. "propuesta - SIN confirmar por el analista")

rates:
  policy_rate_path:           # [{date, value, label: observado|supuesto, source}]
    []
  risk_free_10y: {}           # {value, label, source} — insumo de WACC/CAPM

fx:
  usdmxn_path: []             # [{date, value, label, source}]

inflation:
  mx_3y_trailing_cumulative: {}   # {value, label, source}
  # Monitor NIF B-10: re-expresión se dispara con acumulado trienal >= 26%.
  # Si este valor se acerca a 26%, impact-triage exige pre-modelar el escenario
  # de RECONEXIÓN retrospectiva (NIF B-1) para emisoras NIF.
  mx_forecast_path: []
  us_forecast_path: []

gdp:
  mx_growth_path: []          # insumo de la ruta top-down de revenue
  us_growth_path: []

commodity_decks: []           # [{commodity, unit, path: [{date, value}], label, source}]
                              # ej. cobre para minera (revenue) o cablero (costo)

equity_risk_premium: {}       # {value, label, source} — CAPM
notes: ""

countries: {}                 # un bloque por país adicional, clave = país en minúsculas
# Bloque ABIERTO: los campos de abajo son los que nombra el contrato; una
# sección propia del país (labor, tax, ...) se permite. K3 avisa si el bloque no
# trae as_of, rates.risk_free_10y o equity_risk_premium (insumos del CAPM).
# Qué bloque usa cada emisora lo decide el analista (moneda y mercado de la
# emisora); el plugin pregunta, jamás lo asume.
# Workspace anterior a `countries:` (bloques `mexico:` / `taiwan:` sueltos en el
# primer nivel): ruta de migración en templates/coverage-tree.md.
#
# countries:
#   mexico:
#     as_of: "YYYY-MM-DD"
#     gate_status: ""
#     rates:
#       risk_free_10y: {value: , label: , source: }   # el instrumento que eligió el analista
#     fx:
#       usdmxn_spot: {value: , label: , source: }
#     inflation:
#       headline_yoy: {value: , label: , source: }
#     gdp:
#       forecast_path: []                              # [{date, value, label, source}]
#     equity_risk_premium:
#       value:
#       label: atribuido
#       source: ""
#       components: {}                                 # p. ej. mature_erp, country_risk_premium
#     notes: ""
